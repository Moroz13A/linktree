    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px 40px;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }
        .glow-1 {
            position: absolute;
            top: -100px; left: -100px;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(33,150,243,0.15) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .glow-2 {
            position: absolute;
            bottom: -80px; right: -80px;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(79,195,247,0.1) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .lang-switcher {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(79,195,247,0.2);
            border-radius: 12px;
            padding: 4px;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: #5a5a6a;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .lang-btn:hover { color: #4fc3f7; }
        .lang-btn.active {
            background: linear-gradient(135deg, #4fc3f7, #2196f3);
            color: #0a0a0f;
            box-shadow: 0 0 15px rgba(33,150,243,0.3);
        }
        .avatar-wrap {
            width: 140px; height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4fc3f7, #2196f3);
            padding: 3px;
            box-shadow: 0 0 40px rgba(33,150,243,0.4), 0 0 80px rgba(33,150,243,0.15);
            margin-bottom: 20px;
            position: relative; z-index: 1;
        }
        .avatar-wrap img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover; display: block;
        }
        h1 {
            margin: 0 0 6px 0;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.5px;
            position: relative; z-index: 1;
        }
        .location {
            margin: 0 0 48px 0;
            color: #5a5a6a;
            font-size: 15px;
            font-weight: 500;
            position: relative; z-index: 1;
        }
        .links {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative; z-index: 1;
        }
        .link-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(79,195,247,0.25);
            border-radius: 14px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.35s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }
        .link-card:hover {
            border-color: rgba(79,195,247,0.8);
            box-shadow: 0 0 20px rgba(33,150,243,0.25), inset 0 0 20px rgba(33,150,243,0.05);
            transform: translateY(-2px);
            background: rgba(79,195,247,0.06);
        }
        .link-card.accent {
            background: linear-gradient(135deg, #4fc3f7, #2196f3);
            border: none;
            box-shadow: 0 0 25px rgba(33,150,243,0.35), 0 0 50px rgba(33,150,243,0.1);
        }
        .link-card.accent:hover {
            box-shadow: 0 0 35px rgba(33,150,243,0.5), 0 0 70px rgba(33,150,243,0.2);
        }
        .link-card.accent .link-title { color: #0a0a0f; font-weight: 700; }
        .link-card.accent .link-sub { color: rgba(10,10,15,0.6); }
        .link-card.accent .arrow path { stroke: #0a0a0f; }
        .icon { flex-shrink: 0; width: 26px; height: 26px; }
        .link-text { flex: 1; }
        .link-title { font-weight: 600; font-size: 15px; color: #fff; }
        .link-sub { font-size: 12px; color: #5a5a6a; margin-top: 2px; }
        .arrow { width: 18px; height: 18px; opacity: 0.4; flex-shrink: 0; }
        .accent .arrow { opacity: 0.6; }
        .footer {
            margin-top: 48px;
            color: #33333f;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative; z-index: 1;
        }
    </style>
</head>
